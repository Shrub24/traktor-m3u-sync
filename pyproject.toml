[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "traktor-m3u-sync"
version = "0.1.0"
description = "Nix-first CLI worker for synchronizing Traktor playlists with M3U8 files."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
  "traktor-nml-utils>=4.1.0",
  "typer>=0.16.0",
]

[project.scripts]
traktor-m3u-sync = "traktor_m3u_sync.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.403",
  "pytest>=8.4.1",
  "ruff>=0.12.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traktor_m3u_sync"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
stubPath = "typings"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
